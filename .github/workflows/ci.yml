name: CI Elementares

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  validacao-codigo:
    runs-on: ubuntu-latest

    steps:
    - name: Fazer o Checkout do codigo
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Instalar dependencias
      run: npm ci

    - name: Criar arquivo .env
      run: |
        echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
        echo "VITE_AMBIENTE=producao" >> .env

    - name: Verificar tipagem TypeScript
      run: npx tsc --noEmit

    - name: Rodar Linter
      run: npm run lint --if-present

    - name: Rodar Testes
      run: npm test --if-present -- --passWithNoTests

    - name: Fazer o Build
      run: npm run build

    - name: Notificar falha no Discord
      if: failure()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        title: "❌ Falha no CI do Frontend"
        description: "A validacao do codigo falhou na branch ${{ github.ref_name }}. Verifique o log de execucao no GitHub Actions. Alguém tem que ver isso aí"
        color: 0xff0000