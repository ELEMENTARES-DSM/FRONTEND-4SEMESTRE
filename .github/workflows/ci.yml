name: CI Elementares

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  validacao-codigo:
    runs-on: ubuntu-latest

    steps:
    - name: Fazer o Checkout do codigo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Configurar Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.0.4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Instalar dependencias
      run: npm ci

    - name: Criar arquivo .env
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
      run: |
        echo "VITE_API_URL=$VITE_API_URL" >> .env
        echo "VITE_AMBIENTE=producao" >> .env

    - name: Verificar tipagem TypeScript
      run: npx tsc --noEmit

    - name: Rodar Linter
      run: npm run lint --if-present

    - name: Rodar Testes
      run: npm test --if-present -- --passWithNoTests

    - name: Fazer o Build
      run: npm run build

    - name: 📢 Pull Requests
      if: always() && github.event_name == 'pull_request'
      uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK_PRS }}
        status: ${{ job.status }}
        title: "Status do PR: Frontend"
        description: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }} no Frontend"

    - name: 📢 Atualizações do Repositório
      if: always() && github.event_name == 'push'
      uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK_FEED }}
        status: ${{ job.status }}
        title: "Atualização no Repositório: Frontend"
        description: "A branch ${{ github.ref_name }} recebeu um novo push e a validação do Frontend finalizou com status: ${{ job.status }}."